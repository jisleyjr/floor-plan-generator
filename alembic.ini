# Alembic reads the database URL from fpgen.settings (DATABASE_URL / the
# runtime-directory default). sqlalchemy.url below is a placeholder so a
# forgotten override cannot silently use a project database.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url = sqlite:////tmp/floorplan-alembic-placeholder-do-not-use.sqlite
